name: Private Repo Access Probe

on:
  push:
    paths:
      - '.github/workflows/private-access-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check same-owner private repository access
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          git -c credential.helper= ls-remote "https://x-access-token:${GH_TOKEN}@github.com/uauz1/mueen-islamic-app.git" HEAD >/dev/null 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "PRIVATE_REPO_ACCESS=AVAILABLE"
          else
            echo "PRIVATE_REPO_ACCESS=MISSING"
          fi
          exit 0
