name: Mueen Secret Availability Probe

on:
  push:
    paths:
      - '.github/workflows/secret-availability-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secret availability without exposing values
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          MUEEN_REPO_TOKEN: ${{ secrets.MUEEN_REPO_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          for name in ASC_KEY_P8 IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_APP_PROFILE_BASE64 MUEEN_REPO_TOKEN GH_PAT; do
            if [ -n "${!name}" ]; then
              echo "${name}=AVAILABLE"
            else
              echo "${name}=MISSING"
            fi
          done
